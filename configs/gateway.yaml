# Phase 6 runtime config includes the shipped observability endpoint on /metrics.
server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

routes:
  - path: "/api/users/login"
    strip_prefix: "/api"
    service: "user-service"
    methods: ["POST"]
    auth_required: false
    timeout: 30s
    rate_limit:
      requests: 100
      window: 60s
      strategy: "sliding_window"
    targets:
      - host: "user-service-1"
        port: 8081
        weight: 3
      - host: "user-service-2"
        port: 8091
        weight: 1
    load_balancer: "weighted"

  - path: "/api/users/register"
    strip_prefix: "/api"
    service: "user-service"
    methods: ["POST"]
    auth_required: false
    timeout: 30s
    rate_limit:
      requests: 100
      window: 60s
      strategy: "sliding_window"
    targets:
      - host: "user-service-1"
        port: 8081
        weight: 3
      - host: "user-service-2"
        port: 8091
        weight: 1
    load_balancer: "weighted"

  - path: "/api/users"
    strip_prefix: "/api"
    service: "user-service"
    methods: ["GET", "POST", "PUT", "DELETE"]
    auth_required: true
    timeout: 30s
    rate_limit:
      requests: 100
      window: 60s
      strategy: "sliding_window"
    retry:
      max_attempts: 3
      base_delay: 100ms
      max_delay: 2s
      jitter: "full"
    targets:
      - host: "user-service-1"
        port: 8081
        weight: 3
      - host: "user-service-2"
        port: 8091
        weight: 1
    load_balancer: "weighted"

  - path: "/api/orders"
    strip_prefix: "/api"
    service: "order-service"
    methods: ["GET", "POST"]
    auth_required: true
    timeout: 30s
    rate_limit:
      requests: 50
      window: 60s
      strategy: "sliding_window"
    retry:
      max_attempts: 3
      base_delay: 100ms
      max_delay: 2s
      jitter: "full"
    targets:
      - host: "order-service-1"
        port: 8082
      - host: "order-service-2"
        port: 8092
    load_balancer: "round_robin"

  - path: "/api/payments"
    strip_prefix: "/api"
    service: "payment-service"
    methods: ["GET", "POST"]
    auth_required: true
    timeout: 30s
    rate_limit:
      requests: 20
      window: 60s
      strategy: "sliding_window"
    retry:
      max_attempts: 1
    targets:
      - host: "payment-service-1"
        port: 8083
    load_balancer: "round_robin"

  - path: "/health"
    service: "gateway-internal"
    auth_required: false

circuit_breaker:
  failure_threshold: 5
  success_threshold: 3
  timeout: 30s
  window_size: 60s
  half_open_max_requests: 3

auth:
  jwt_secret: "${JWT_SECRET}"
  jwt_algorithm: "HS256"

redis:
  address: "redis:6379"
  password: ""
  db: 0

metrics:
  enabled: true
  path: "/metrics"
