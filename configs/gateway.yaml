# Phase 2 runtime config only includes behavior implemented on main.
server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

routes:
  - path: "/api/users/login"
    strip_prefix: "/api"
    service: "user-service"
    methods: ["POST"]
    timeout: 30s
    targets:
      - host: "user-service-1"
        port: 8081
        weight: 3
      - host: "user-service-2"
        port: 8091
        weight: 1
    load_balancer: "weighted"

  - path: "/api/users/register"
    strip_prefix: "/api"
    service: "user-service"
    methods: ["POST"]
    timeout: 30s
    targets:
      - host: "user-service-1"
        port: 8081
        weight: 3
      - host: "user-service-2"
        port: 8091
        weight: 1
    load_balancer: "weighted"

  - path: "/api/users"
    strip_prefix: "/api"
    service: "user-service"
    methods: ["GET", "POST", "PUT", "DELETE"]
    timeout: 30s
    targets:
      - host: "user-service-1"
        port: 8081
        weight: 3
      - host: "user-service-2"
        port: 8091
        weight: 1
    load_balancer: "weighted"

  - path: "/api/orders"
    strip_prefix: "/api"
    service: "order-service"
    methods: ["GET", "POST"]
    timeout: 30s
    targets:
      - host: "order-service-1"
        port: 8082
      - host: "order-service-2"
        port: 8092
    load_balancer: "round_robin"

  - path: "/api/payments"
    strip_prefix: "/api"
    service: "payment-service"
    methods: ["POST"]
    timeout: 30s
    targets:
      - host: "payment-service-1"
        port: 8083
    load_balancer: "round_robin"

  - path: "/health"
    service: "gateway-internal"
