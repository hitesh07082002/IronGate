name: CI

on:
  push:
  pull_request:

jobs:
  go-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run make lint
        run: make lint

      - name: Run make test -race
        run: make test-race

      - name: Run make build
        run: make build
