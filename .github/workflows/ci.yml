name: CI

on:
  push:
  pull_request:

jobs:
  go-ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IRONGATE_TEST_REDIS_ADDR: 127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run make lint
        run: make lint

      - name: Run make test
        run: make test

      - name: Run make coverage
        run: make coverage

      - name: Run make test -race
        run: make test-race

      - name: Run make build
        run: make build
