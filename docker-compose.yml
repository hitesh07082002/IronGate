x-go-build-args: &go-build-args
  GOPROXY: "${IRONGATE_GOPROXY:-https://proxy.golang.org,direct}"
  GOSUMDB: "${IRONGATE_GOSUMDB:-sum.golang.org}"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args: *go-build-args
    depends_on:
      redis:
        condition: service_healthy
      user-service-1:
        condition: service_started
      user-service-2:
        condition: service_started
      order-service-1:
        condition: service_started
      order-service-2:
        condition: service_started
      payment-service-1:
        condition: service_started
    ports:
      - "${IRONGATE_GATEWAY_BIND_HOST:-127.0.0.1}:8080:8080"
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      REDIS_ADDR: redis:6379
      IRONGATE_TRUSTED_PROXIES: "${IRONGATE_TRUSTED_PROXIES:-}"

  prometheus:
    image: prom/prometheus:v2.53.1
    depends_on:
      gateway:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:11.1.0
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service-1:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
      args: *go-build-args
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      IRONGATE_ALLOW_LOGIN_OVERRIDES: "${IRONGATE_ALLOW_LOGIN_OVERRIDES:-false}"

  user-service-2:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
      args: *go-build-args
    environment:
      PORT: 8091
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      IRONGATE_ALLOW_LOGIN_OVERRIDES: "${IRONGATE_ALLOW_LOGIN_OVERRIDES:-false}"

  order-service-1:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
      args: *go-build-args

  order-service-2:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
      args: *go-build-args
    environment:
      PORT: 8092

  payment-service-1:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
      args: *go-build-args
    ports:
      - "127.0.0.1:18083:8083"
