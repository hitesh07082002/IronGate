services:
  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: irongate
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      ADMIN_ADDR: ":9090"
      REDIS_ADDR: toxiproxy:6380
      GATEWAY_CONTAINER_NAME: irongate-gateway-1

  user-service-1:
    environment:
      IRONGATE_ALLOW_LOGIN_OVERRIDES: "true"

  user-service-2:
    environment:
      IRONGATE_ALLOW_LOGIN_OVERRIDES: "true"

  grafana:
    volumes:
      - ./monitoring/grafana/provisioning/grafana-demo.ini:/etc/grafana/grafana.ini:ro

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0

  observatory:
    build:
      context: .
      dockerfile: Dockerfile.observatory
    depends_on:
      gateway:
        condition: service_started
      prometheus:
        condition: service_started
      redis:
        condition: service_started
      toxiproxy:
        condition: service_started
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      DEMO_TOKEN: "${DEMO_TOKEN:?DEMO_TOKEN must be set}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN must be set}"
      DEMO_JWT: "${DEMO_JWT:-}"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-irongate}"
      GATEWAY_CONTAINER_NAME: "${GATEWAY_CONTAINER_NAME:-irongate-gateway-1}"
      PROJECT_ROOT: "${PWD:?PWD must be set}"
      REDIS_ADDR: toxiproxy:6380
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
