services:
  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: irongate
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      ADMIN_ADDR: ":9090"
      GATEWAY_CONTAINER_NAME: irongate-gateway-1
      # REDIS_ADDR is inherited from the base docker-compose.yml for M1.
      # M2 will explicitly override it with toxiproxy:6380 when Toxiproxy is introduced.

  grafana:
    volumes:
      - ./monitoring/grafana/provisioning/grafana-demo.ini:/etc/grafana/grafana.ini:ro
