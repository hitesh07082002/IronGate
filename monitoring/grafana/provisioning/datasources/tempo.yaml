apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    basicAuth: false
    jsonData:
      serviceMap:
        datasourceUid: irongate-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      spanBar:
        type: "Tag"
        tag: "http.status_code"
